
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftmania - Play Online</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#11131b;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px 25px;
 background:#202536;
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:25px;font-weight:900;color:#ffc34d}
main{max-width:1100px;margin:30px auto;padding:15px}
.game{
 background:#202536;padding:15px;
 border-radius:12px;
}
iframe{
 width:100%;height:650px;
 border:0;background:#000;
}
h1{color:#ffc34d}
button{
 padding:12px 20px;
 background:#ffc34d;border:0;
 border-radius:6px;font-weight:bold;
 cursor:pointer;
}
.info{color:#bbc2d2;line-height:1.7}
</style>
</head>
<body>
<header>
 <div class="logo">🏁 DRIFTMANIA</div>
 <button onclick="fullscreen()">FULLSCREEN</button>
</header>

<main>
 <h1>Driftmania</h1>
 <p class="info">Tiny Tracks. Fast Laps.</p>

 <div class="game">
  <iframe id="gameFrame"
   src="https://frenchie14.itch.io/driftmania"
   allowfullscreen>
  </iframe>
 </div>

 <h2>Controls</h2>
 <p class="info">
 ↑ / Z: Accelerate<br>
 ↓: Brake and reverse<br>
 ← / →: Steering<br>
 X: D-Brake<br>
 R: Restart<br>
 P: Pause
 </p>
</main>

<script>
function fullscreen(){
 const frame=document.getElementById("gameFrame");
 if(frame.requestFullscreen)frame.requestFullscreen();
}
</script>
</body>
</html>
